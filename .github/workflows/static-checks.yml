name: static-checks

# One offline command: compile Python, parse JSON, recount committed pilot
# rows, recompute the decay report, and pin README quotes to the ledger.
# No third-party packages, no model calls, no network.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-index-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline index check
        run: python3 scripts/check_index.py
